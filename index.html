<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Age gate: shows once when the page loads. This is just a UI
       feature (self-reported, not real verification) that unlocks
       the "Adult" category filter below. -->
  <div id="ageGateModal" class="modal-overlay">
    <div class="modal-box">
      <h2>Quick check</h2>
      <p>Are you 18 or older? This just unlocks the "Adult" filter option for search results. It's an honor-system check, not real ID verification.</p>
      <div class="modal-buttons">
        <button id="ageYesBtn">Yes, I'm 18+</button>
        <button id="ageNoBtn">No / Skip</button>
      </div>
    </div>
  </div>

  <header>
    <h1>📚 Book Finder</h1>
    <p>Search for any book using the Open Library API</p>
  </header>

  <!-- Search bar -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Try 'Harry Potter' or an author name...">
    <button id="searchBtn">Search</button>
  </div>

  <!-- Simple filter for sorting results -->
  <div class="filter-container">
    <label for="sortSelect">Sort by:</label>
    <select id="sortSelect">
      <option value="relevance">Relevance</option>
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </div>

  <!-- Category filter buttons. These sort results into Kids/Teen/Adult
       based on the subject tags Open Library gives us for each book. -->
  <div class="category-filter" id="categoryFilter">
    <button class="category-btn active" data-category="all">All</button>
    <button class="category-btn" data-category="kids">Kids</button>
    <button class="category-btn" data-category="teen">Teen</button>
    <button class="category-btn" data-category="adult" id="adultFilterBtn">Adult</button>
  </div>

  <!-- Loading message, hidden by default -->
  <p id="loadingMsg" class="hidden">Searching...</p>

  <!-- Message for no results / errors -->
  <p id="statusMsg" class="hidden"></p>

  <!-- Results get inserted here by script.js -->
  <div id="results" class="results-grid"></div>

  <footer>
    <p>Book data from <a href="https://openlibrary.org/developers/api" target="_blank">Open Library</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
